[project]
name = "specflow"
version = "0.1.0"
description = "A skill-first development protocol for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
specflow = "specflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
